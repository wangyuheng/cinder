backend: ollama
code_quality_threshold: 0.8
codex_integration:
  default_executor: exec
  enabled: true
  exec:
    approval_policy: never
    ephemeral: true
    full_auto: true
    model: gpt-5.4
    sandbox_mode: danger-full-access
    skip_git_repo_check: true
    timeout: 300
  fallback_on_error: true
decision_logging: true
enable_comprehensive_evaluation: true
enable_iterative_generation: true
enable_plan_validation: true
evaluation_quality_threshold: 0.7
force_file_creation: true
max_iterations: 3
meta_path: ''
model: test-model
ollama_base_url: http://localhost:11434
ollama_debug: false
ollama_keep_alive: 10m
ollama_stream: false
plan_quality_threshold: 0.7
proxy_mode: false
reflection_loop: false
sleep_seconds: 1.0
soul_path: soul.md
temperature: 0.2
